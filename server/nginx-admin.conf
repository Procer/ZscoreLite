# Bloque a agregar DENTRO del `server { ... }` de 443 de
# /etc/nginx/sites-available/lite.zscore.ar, junto a los de /api/live y /api/license.
# Reenvia el panel de administracion (pagina /admin y API /api/admin) al servicio de licencias.
# install-license.sh lo agrega solo; esto es para hacerlo a mano.
#
# Opcional y recomendado: descomentar allow/deny para que solo se pueda entrar desde tu IP fija.
# (Si tu IP cambia hay que actualizarla aca; sin esto el panel queda protegido solo por la contrasena.)

    location ~ ^/(admin|api/admin)(/|$) {
        # allow 203.0.113.10;
        # deny all;
        proxy_pass http://127.0.0.1:3721;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 150m;      # el APK se sube por aca
        proxy_request_buffering off;    # pasa el archivo directo, sin guardarlo dos veces
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
