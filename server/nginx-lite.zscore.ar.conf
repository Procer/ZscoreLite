# Alta de lite.zscore.ar (Z-Score Lite) en el VPS.
# 1) DNS: A  lite -> IP del VPS
# 2) Usar la raiz/proxy del server actual de Lite (mismos location /api/live y /api/license)
# 3) ln -s /etc/nginx/sites-available/lite.zscore.ar /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
# 4) certbot --nginx -d lite.zscore.ar
# NO borrar lite.zscore.ar: los APK ya instalados apuntan ahi.
# En el servicio de licencias: PUBLIC_URL=https://lite.zscore.ar

server {
    listen 80;
    server_name lite.zscore.ar;
    # Mismo contenido que lite.zscore.ar: reemplazar por su `root` real
    root /var/www/zscore/lite;
    index index.html;

    # + pegar aca nginx-live.conf y nginx-license.conf

    location / {
        try_files $uri $uri/ /index.html;
    }
}
