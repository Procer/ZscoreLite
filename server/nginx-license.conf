# Bloque a agregar DENTRO del `server { ... }` de 443 de
# /etc/nginx/sites-available/zscorelite.anka.ar, junto al de /api/live.
# Solo reenvia /api/license al servicio local; el resto del sitio no cambia.

    location ~ ^/api/license(/|$) {
        proxy_pass http://127.0.0.1:3721;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
    }
