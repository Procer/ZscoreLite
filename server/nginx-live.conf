# Bloque a agregar DENTRO del `server { ... }` de 443 de
# /etc/nginx/sites-available/zscorelite.anka.ar, antes de `location / { ... }`.
# Solo reenvia /api/live al servicio local; el resto del sitio no cambia.

    location ~ ^/api/live(/|$) {
        proxy_pass http://127.0.0.1:3720;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tiempo real (Server-Sent Events): sin buffer y con conexiones largas
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # El estado de un partido pesa unos pocos KB
        client_max_body_size 32k;
    }
