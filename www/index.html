<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Z-Score Lite" />
  <title>Z-Score Lite</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- PIN DE ACCESO -->
  <section id="view-pin" class="view">
    <img class="home-logo home-logo--big" src="icons/icon-192.png" alt="Z-Score Lite" />
    <div class="wizard-question" id="pin-title">Ingresá tu PIN</div>
    <div class="wizard-sub" id="pin-sub">&nbsp;</div>
    <input type="tel" inputmode="numeric" maxlength="4" id="pin-input" autocomplete="off" />
    <button class="btn btn-ghost" id="pin-forgot" style="margin-top:10px;">Olvidé mi PIN</button>
  </section>

  <!-- HOME -->
  <section id="view-home" class="view">
    <img class="home-logo home-logo--big" src="icons/icon-192.png" alt="Z-Score Lite" />
    <div class="home-title">Z-Score <strong>Lite</strong></div>
    <div class="home-actions">
      <button class="btn btn-primary btn-block" data-action="go-setup">Nuevo partido</button>
      <button class="btn btn-ghost btn-block" data-action="go-history">Historial</button>
      <button class="btn btn-ghost btn-block" data-action="go-last-match" id="btn-last-match" style="display:none;">Ver último partido</button>
    </div>
    <div class="home-footer">
      <a href="https://www.zaratesystemgroup.com.ar" target="_blank" rel="noopener">Creado por ZSG</a>
      <span class="home-footer-sep">·</span>
      <a href="https://www.zscore.ar" target="_blank" rel="noopener">zscore.ar</a>
    </div>
  </section>

  <!-- RETOMAR PARTIDO -->
  <div class="overlay" id="overlay-resume">
    <div class="sheet">
      <h2>Tenés un partido sin terminar</h2>
      <p id="resume-summary"></p>
      <button class="btn btn-primary btn-block" data-action="resume-continue">Continuar ese partido</button>
      <button class="btn btn-ghost btn-block" data-action="resume-discard">Empezar uno nuevo</button>
    </div>
  </div>

  <!-- SETUP WIZARD (guiado, una pregunta a la vez) -->
  <section id="view-setup" class="view">
    <div class="setup-header">
      <button class="icon-btn" data-action="setup-back">←</button>
      <div class="wizard-progress-track"><div class="wizard-progress-fill" id="wizard-progress-fill"></div></div>
    </div>
    <div class="wizard-step" id="wizard-step"></div>
  </section>

  <!-- SCOREBOARD -->
  <section id="view-scoreboard" class="view">
    <div class="scoreboard-topbar">
      <div class="match-clock" id="match-clock">00:00</div>
      <button class="icon-btn" data-action="open-menu">⋮</button>
    </div>
    <div class="tiebreak-banner" id="tiebreak-banner" style="display:none;">TIE-BREAK</div>
    <div class="scoreboard">
      <div class="team-panel team-panel--a" data-action="point" data-team="A">
        <div class="team-name"><span class="serve-ball" id="serve-dot-a">🎾</span><span id="name-a">Pareja A</span></div>
        <div class="team-point" id="point-a">0</div>
        <div class="team-games">
          <div class="game-pip" id="games-a">0</div>
        </div>
        <div class="sets-row" id="sets-a"></div>
        <button class="team-subtract-btn" data-action="undo-team" data-team="A" aria-label="Restar tanto a Pareja A">−</button>
      </div>
      <div class="team-panel team-panel--b" data-action="point" data-team="B">
        <div class="team-name"><span class="serve-ball" id="serve-dot-b">🎾</span><span id="name-b">Pareja B</span></div>
        <div class="team-point" id="point-b">0</div>
        <div class="team-games">
          <div class="game-pip" id="games-b">0</div>
        </div>
        <div class="sets-row" id="sets-b"></div>
        <button class="team-subtract-btn" data-action="undo-team" data-team="B" aria-label="Restar tanto a Pareja B">−</button>
      </div>
    </div>
  </section>

  <!-- MENU overlay (durante el partido) -->
  <div class="overlay" id="overlay-menu">
    <div class="sheet">
      <h2>Partido en curso</h2>
      <button class="btn btn-ghost btn-block" data-action="undo-point">↩ Deshacer último tanto</button>
      <button class="btn btn-danger btn-block" data-action="end-match">Finalizar partido</button>
      <button class="btn btn-ghost btn-block" data-action="close-menu">Volver al marcador</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <section id="view-summary" class="view">
    <div class="summary-winner" id="summary-winner">Ganó Pareja A</div>
    <div class="summary-score" id="summary-score">2 - 1</div>
    <div class="summary-detail" id="summary-detail"></div>
    <div class="home-actions">
      <button class="btn btn-primary btn-block" data-action="go-home">Volver al inicio</button>
      <button class="btn btn-ghost btn-block" data-action="go-history">Ver historial</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view">
    <div class="setup-header">
      <button class="icon-btn" data-action="go-home">←</button>
      <h1>Historial</h1>
    </div>
    <div id="history-list"></div>
  </section>

  <!-- DETALLE DE PARTIDO -->
  <div class="overlay" id="overlay-match-detail">
    <div class="sheet" id="match-detail-content"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
