<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Z-Score Lite" />
  <title>Z-Score Lite</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- PIN DE ACCESO -->
  <section id="view-pin" class="view">
    <img class="home-logo home-logo--big" src="icons/icon-192.png" alt="Z-Score Lite" />
    <div class="wizard-question" id="pin-title">Ingresá tu PIN</div>
    <div class="wizard-sub" id="pin-sub">&nbsp;</div>
    <input type="tel" inputmode="numeric" maxlength="4" id="pin-input" autocomplete="off" />
    <button class="btn btn-ghost" id="pin-forgot" style="margin-top:10px;">Olvidé mi PIN</button>
  </section>

  <!-- HOME -->
  <section id="view-home" class="view">
    <img class="home-logo home-logo--big" src="icons/icon-192.png" alt="Z-Score Lite" />
    <div class="home-title">Z-Score <strong>Lite</strong></div>
    <div class="home-actions">
      <button class="btn btn-primary btn-block" data-action="go-setup">Nuevo partido</button>
      <button class="btn btn-ghost btn-block" data-action="go-history">Historial y ranking</button>
      <button class="btn btn-ghost btn-block" data-action="go-settings">Configuración</button>
      <button class="btn btn-ghost btn-block" data-action="go-last-match" id="btn-last-match" style="display:none;">Ver último partido</button>
    </div>
    <div class="home-footer">
      <a href="https://www.zaratesystemgroup.com.ar" target="_blank" rel="noopener">Creado por ZSG</a>
      <span class="home-footer-sep">·</span>
      <a href="https://www.zscore.ar" target="_blank" rel="noopener">zscore.ar</a>
    </div>
  </section>

  <!-- RETOMAR PARTIDO -->
  <div class="overlay" id="overlay-resume">
    <div class="sheet">
      <h2>Tenés un partido sin terminar</h2>
      <p id="resume-summary"></p>
      <button class="btn btn-primary btn-block" data-action="resume-continue">Continuar ese partido</button>
      <button class="btn btn-ghost btn-block" data-action="resume-discard">Empezar uno nuevo</button>
    </div>
  </div>

  <!-- SETUP WIZARD (guiado, una pregunta a la vez) -->
  <section id="view-setup" class="view">
    <div class="setup-header">
      <button class="icon-btn" data-action="setup-back">←</button>
      <div class="wizard-progress-track"><div class="wizard-progress-fill" id="wizard-progress-fill"></div></div>
    </div>
    <div class="wizard-step" id="wizard-step"></div>
  </section>

  <!-- SCOREBOARD -->
  <section id="view-scoreboard" class="view">
    <div class="scoreboard-topbar">
      <div class="match-clock" id="match-clock">00:00</div>
      <button class="icon-btn" data-action="open-menu">⋮</button>
    </div>
    <div class="tiebreak-banner" id="tiebreak-banner" style="display:none;">TIE-BREAK</div>
    <div class="tap-hint" id="tap-hint" style="display:none;"><span id="tap-text"></span><i class="tap-bar" id="tap-bar"></i></div>
    <div class="serve-hint" id="serve-hint" style="display:none;"><strong>¿QUIÉN SACA?</strong><span>CONTROL: 1 TOQUE = IZQUIERDA<br>2 TOQUES = DERECHA</span></div>
    <div class="scoreboard">
      <div class="team-panel team-panel--a" data-action="point" data-team="A">
        <span class="serve-ball serve-ball--a" id="serve-dot-a"></span>
        <div class="team-top">
          <div class="team-name" id="name-a">Pareja A</div>
          <div class="team-meta"><span class="lbl">GAMES</span> <span id="games-a">0</span> <span class="sep">&middot;</span> <span class="lbl">SETS</span> <span id="sets-a">0</span></div>
        </div>
        <div class="team-point" id="point-a">0</div>
        <button class="team-subtract-btn team-subtract-btn--a" data-action="undo-team" data-team="A" aria-label="Restar tanto a Pareja A">−</button>
      </div>
      <div class="team-panel team-panel--b" data-action="point" data-team="B">
        <span class="serve-ball serve-ball--b" id="serve-dot-b"></span>
        <div class="team-top">
          <div class="team-name" id="name-b">Pareja B</div>
          <div class="team-meta"><span class="lbl">GAMES</span> <span id="games-b">0</span> <span class="sep">&middot;</span> <span class="lbl">SETS</span> <span id="sets-b">0</span></div>
        </div>
        <div class="team-point" id="point-b">0</div>
        <button class="team-subtract-btn team-subtract-btn--b" data-action="undo-team" data-team="B" aria-label="Restar tanto a Pareja B">−</button>
      </div>
    </div>
    <div class="win-banner" id="win-banner"><div class="wb-title" id="wb-title"></div><div class="wb-sub" id="wb-sub"></div></div>
    <canvas class="fx-canvas" id="fx-canvas"></canvas>
  </section>

  <!-- MENU overlay (durante el partido) -->
  <div class="overlay" id="overlay-menu">
    <div class="sheet">
      <h2>Partido en curso</h2>
      <button class="btn btn-ghost btn-block" data-action="undo-point">↩ Deshacer último tanto</button>
      <button class="btn btn-ghost btn-block" data-action="open-live">📡 Compartir en vivo</button>
      <button class="btn btn-ghost btn-block" data-action="pause-match">⏸ Pausar y volver al inicio</button>
      <button class="btn btn-danger btn-block" data-action="end-match">Finalizar partido</button>
      <button class="btn btn-ghost btn-block" data-action="close-menu">Volver al marcador</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <section id="view-summary" class="view">
    <div class="summary-winner" id="summary-winner">Ganó Pareja A</div>
    <div class="summary-score" id="summary-score">2 - 1</div>
    <div class="summary-detail" id="summary-detail" style="width:100%; max-width:380px;"></div>
    <div id="summary-stats" style="width:100%; max-width:380px;"></div>
    <div class="home-actions">
      <button class="btn btn-primary btn-block" data-action="copy-match">📋 Copiar imagen</button>
      <button class="btn btn-ghost btn-block" data-action="go-home">Volver al inicio</button>
      <button class="btn btn-ghost btn-block" data-action="go-history">Ver historial</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="view-history" class="view">
    <div class="setup-header">
      <button class="icon-btn" data-action="go-home">←</button>
      <h1>Historial</h1>
    </div>
    <div class="hist-tabs" id="hist-tabs">
      <button class="hist-tab is-active" data-tab="matches">Partidos</button>
      <button class="hist-tab" data-tab="pairs">Parejas</button>
      <button class="hist-tab" data-tab="players">Jugadores</button>
    </div>
    <div id="history-list"></div>
  </section>

  <!-- PARTIDO EN VIVO -->
  <div class="overlay" id="overlay-live">
    <div class="sheet" id="live-content"></div>
  </div>

  <!-- EDITAR JUGADOR -->
  <div class="overlay" id="overlay-player-edit">
    <div class="sheet" id="player-edit-content"></div>
  </div>

  <!-- CONFIGURACION -->
  <section id="view-settings" class="view">
    <div class="setup-header">
      <button class="icon-btn" data-action="go-home">←</button>
      <h1>Configuración</h1>
    </div>
    <div id="settings-body"></div>
    <input type="file" id="backup-file" accept=".json,application/json" style="display:none;" />
  </section>

  <!-- DETALLE DE PARTIDO -->
  <div class="overlay" id="overlay-match-detail">
    <div class="sheet" id="match-detail-content"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
